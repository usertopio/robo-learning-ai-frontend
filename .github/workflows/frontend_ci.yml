name: Frontend_CI

on:
  push:
    branches: [main, top]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests before building"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout Backend repo
        uses: actions/checkout@v4
        with:
          repository: usertopio/robo-learning-ai-backend
          path: backend-temp

      - name: Move Backend Repo
        run: mv backend-temp ../robo-learn-ai-backend

      - name: Setup Node.js
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Install Backend Dependencies
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        run: cd ../robo-learn-ai-backend && npm ci

      - name: Install Frontend Dependencies
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        run: npm ci

      - name: Run Tests
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        run: npm test

      - name: Install Playwright Browsers
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        run: npm run test:e2e

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            usertopio/robo-learn-ai-frontend:latest-amd64-arm64
            usertopio/robo-learn-ai-frontend:0.0.0-amd64-arm64
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
